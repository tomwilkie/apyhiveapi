[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhive-integration"
version = "2.0.0.B4"
description = "An async Python library to interface with the Hive API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KJonline24", email = "53_galleys_snark@icloud.com" }]
keywords = ["hive", "home", "api", "library", "smart-home", "home-automation", "IoT", "async", "integration"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Home Assistant pins boto3/botocore (1.42.x at the time of writing) and
# aiohttp in its package_constraints.txt, so keep these floors low and
# never add an upper bound: a range Home Assistant cannot satisfy makes
# the integration fail to install.
dependencies = [
    "aiohttp",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.urls]
Homepage = "https://github.com/tomwilkie/pyhive-integration"
Source = "https://github.com/tomwilkie/pyhive-integration"
"Issue Tracker" = "https://github.com/tomwilkie/pyhive-integration/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pylint",
    "ruff",
    "mypy",
    "bandit",
    "pre-commit",
    "build",
]

[tool.setuptools]
# Listed explicitly so the data directory (no __init__.py) ships too. Keep in
# sync with the directories under src/apyhiveapi/.
packages = [
    "apyhiveapi",
    "apyhiveapi.data",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"apyhiveapi.data" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Rules that conflict with the formatter.
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
    # Exception messages are plain strings at the raise site; EM101/EM102
    # already keep them out of the raise expression.
    "TRY003",
    # Positional-argument counts are policed by pylint's too-many-positional-arguments.
    "PLR0917",
    # No per-file copyright headers.
    "CPY001",
    # The exception names are part of the API the Home Assistant fork imports.
    "N818",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # asserts are the point of a test
    "S105",     # fake tokens and passwords in fixtures
    "S106",
    "S107",
    "ANN",      # test functions need no annotations
    "D",        # test docstrings are optional
    "SLF001",   # tests exercise private helpers
    "PLR2004",  # magic values are expected in test assertions
    "PLR0913",  # test factory functions legitimately take many parameters
    "PLC0415",  # conditional/lazy imports are a valid test-isolation pattern
    "ARG",      # fixtures and stubs take arguments they do not use
    "FBT",      # boolean positional arguments mirror the API under test
    "EM",       # tests raise throwaway exceptions with literal messages
    "TRY002",   # and plain Exception stands in for "anything unexpected"
]
"scripts/**" = [
    "T201",     # command-line tools print
    "S603",     # and spawn processes
    "S607",
    "ASYNC",    # blocking calls are fine in a developer tool
    "INP001",   # scripts are not a package
    "EM",       # usage errors are one-off messages at the raise site
]
"examples/**" = [
    "T201",     # examples print
    "ASYNC",    # blocking input() keeps the example simple
    "INP001",   # examples are not a package
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-context=test --cov-report=lcov:coverage/lcov.info --cov-report=html:coverage/html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
data_file = "coverage/.coverage"
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 99
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "coverage/html"
show_contexts = true

[tool.coverage.lcov]
output = "coverage/lcov.info"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
# The Hive API returns untyped JSON, so values read from it are Any and are
# returned from typed functions throughout; flagging each one adds nothing.
warn_return_any = false
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are untyped by design (see the ANN ignore above) and lean on MagicMock.
module = ["tests.*"]
ignore_errors = true
