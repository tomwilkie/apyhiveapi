[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhive-integration"
version = "2.0.0.B4"
description = "An async Python library to interface with the Hive API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KJonline24", email = "53_galleys_snark@icloud.com" }]
keywords = ["hive", "home", "api", "library", "smart-home", "home-automation", "IoT", "async", "integration"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Home Assistant pins boto3/botocore (1.42.x at the time of writing) and
# aiohttp in its package_constraints.txt, so keep these floors low and
# never add an upper bound: a range Home Assistant cannot satisfy makes
# the integration fail to install.
dependencies = [
    "aiohttp",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.urls]
Homepage = "https://github.com/Pyhass/Pyhive"
Source = "https://github.com/Pyhass/Pyhive"
"Issue Tracker" = "https://github.com/Pyhass/Pyhive/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pylint",
    "ruff",
    "mypy",
    "bandit",
    "pre-commit",
]

[tool.setuptools]
# Listed explicitly because package-dir renames src/ to apyhiveapi, which
# automatic discovery cannot express. Keep in sync with the directories
# under src/.
packages = [
    "apyhiveapi",
    "apyhiveapi.api",
    "apyhiveapi.data",
    "apyhiveapi.devices",
    "apyhiveapi.helper",
    "apyhiveapi.session",
]

[tool.setuptools.package-dir]
apyhiveapi = "src"

[tool.setuptools.package-data]
"apyhiveapi.data" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "PL"]
ignore = [
    "E501",     # line length is handled by the formatter
    "PLR0917",  # positional-argument counts are policed by pylint's too-many-positional-arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic values are expected in test assertions
    "PLR0913",  # test factory functions legitimately take many parameters
    "PLC0415",  # conditional/lazy imports are a valid test-isolation pattern
]

[tool.ruff.lint.isort]
known-third-party = ["aiohttp", "apyhiveapi", "boto3", "botocore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-context=test --cov-report=lcov:coverage/lcov.info --cov-report=html:coverage/html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
data_file = "coverage/.coverage"
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 99
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "coverage/html"
show_contexts = true

[tool.coverage.lcov]
output = "coverage/lcov.info"

[tool.mypy]
python_version = "3.13"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
