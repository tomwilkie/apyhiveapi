name: Release

# Releases are cut from main: change `version` in pyproject.toml and merge.
# This tags the merge commit, builds the sdist and wheel, checks that the
# wheel imports in a clean venv and publishes a GitHub Release with both
# attached. The Home Assistant fork pins a release's wheel URL in its
# manifest.json. See docs/workflows/README.md.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already tagged
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the distributions
        if: steps.tag.outputs.exists == 'false'
        run: |
          python -m pip install build
          python -m build

      - name: Verify the wheel imports in a clean venv
        if: steps.tag.outputs.exists == 'false'
        run: python scripts/verify_dist.py dist

      - name: Create the GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          artifacts: dist/*
          artifactErrorsFailBuild: true
