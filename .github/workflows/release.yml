name: Release

# Every merge into main is a release. bump-my-version bumps the patch version
# in pyproject.toml, commits it as github-actions[bot] and tags it; the job
# builds the sdist and wheel, checks that the wheel imports in a clean venv,
# and only then pushes the commit and tag to main and publishes a GitHub
# Release with both files attached. For a minor or major release, run the
# workflow by hand (Actions → Release → Run workflow) and pick the part to
# bump. The Home Assistant fork pins a release's wheel URL in its
# manifest.json. See docs/workflows/README.md.
#
# This cannot loop: the bump commit carries "[skip release]", which the job
# condition honours, and a push made with GITHUB_TOKEN triggers no workflows
# anyway. Runs are serialised so two quick merges do not race for the same
# patch number.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      part:
        description: Part of the version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag and release
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tip of main, not the pushed sha: a merge that lands while an
          # earlier run is still releasing is picked up by that run.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the release tools
        run: python -m pip install bump-my-version build

      - name: Bump the version, commit and tag
        id: version
        env:
          PART: ${{ inputs.part || 'patch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump-my-version bump "$PART"
          echo "tag=v$(bump-my-version show current_version)" >> "$GITHUB_OUTPUT"

      - name: Build the distributions
        run: python -m build

      - name: Verify the wheel imports in a clean venv
        run: python scripts/verify_dist.py dist

      - name: Push the bump and its tag to main
        run: git push --follow-tags origin HEAD:main

      - name: Create the GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generateReleaseNotes: true
          artifacts: dist/*
          artifactErrorsFailBuild: true
